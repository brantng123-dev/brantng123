  const rec=recommend(M,e1,e2);
  if (viewK2===null||viewK2>=M.nL) viewK2=defaultK();
  const famOpt=sel=>Object.keys(FAM).map(k=>{const e=R.all.find(x=>x.key===k);const tag=e.bad?` (${e.bad} member(s) not feasible)`:(!e.valid?' (not applicable)':'');return `<option value="${k}" ${k===sel?'selected':''}>${k}: ${esc(FAM[k].short)}${tag}</option>`;}).join('');
  let html=`<div class="card"><h2>Choose two schemes</h2><div class="row"><label>Scheme 1 <select id="pk1">${famOpt(a)}</select></label><label>Scheme 2 <select id="pk2">${famOpt(b)}</select></label><button id="pkAuto">Auto-select</button></div>
  <div class="hint" style="margin-top:6px">Feasible systems (relative cost, low to high): ${R.ok.map(e=>`${e.key} (${f(e.cost,1)})`).join(' › ')||'no fully feasible system'}${R.rest.length?'; not usable: '+R.rest.map(e=>e.key+(e.bad?` (${e.bad} not feasible)`:' (not applicable)')).join(', '):''}</div></div>`;
  html+=`<div class="card"><h2>Comparison and recommendation</h2><table><thead><tr><th>Criterion</th><th>Scheme 1 (${a})</th><th>Scheme 2 (${b})</th><th>Note</th></tr></thead><tbody>${rec.rows.map(r=>`<tr><td>${esc(r.name)}</td><td>${r.w===0||r.w===2?'✓':''}</td><td>${r.w===1||r.w===2?'✓':''}</td><td class="hint">${esc(r.why)}</td></tr>`).join('')}
  <tr><th>Score</th><th>${rec.pts[0]}</th><th>${rec.pts[1]}</th><th></th></tr></tbody></table>
  <p><b>Recommended: Scheme ${rec.rec===0?'1':'2'} (${[a,b][rec.rec]}: ${esc(FAM[[a,b][rec.rec]].short)})</b> <span class="hint">The criteria are a rough comparison; use your own judgement against the question's requirements.</span></p></div>`;
  html+=`<div class="card"><h2>Scheme framing plan</h2><div class="row" style="margin-bottom:6px"><label>Scheme <select id="sv">${[a,b].map((k,i)=>`<option value="${i}" ${i===schemeView?'selected':''}>Scheme ${i+1} (${k})</option>`).join('')}</select></label><label>Slab ${levelSelect('selK2',viewK2)}</label></div>${planSVG(M,viewK2,[e1,e2][schemeView])}${legend(true)}</div>`;
  const recTxt=`Recommendation: Scheme ${rec.rec===0?'1':'2'} (${FAM[[a,b][rec.rec]].en}) is recommended because:\n`+rec.rows.filter(r=>r.w===rec.rec).map(r=>`- ${r.en}`).join('\n');
  const t1=schemeText(M,e1,'Scheme 1'), t2=schemeText(M,e2,'Scheme 2');
  html+=`<div class="grid2"><div class="card"><h2>Scheme 1 (draft text)<button data-copy="t1" style="float:right">Copy</button></h2><pre class="txt" id="t1">${esc(t1)}</pre></div>
  <div class="card"><h2>Scheme 2 (draft text)<button data-copy="t2" style="float:right">Copy</button></h2><pre class="txt" id="t2">${esc(t2)}</pre></div></div>
  <div class="card"><h2>Reasons for recommendation (draft text)<button data-copy="t3" style="float:right">Copy</button></h2><pre class="txt" id="t3">${esc(recTxt)}</pre></div>
  <div class="card"><h2>Export</h2><button id="bCsv">Export member table CSV (for your spreadsheet)</button> <button id="bTxt">Export all text (.txt)</button></div>`;
  h.innerHTML=html;
  $('#pk1').onchange=e=>{S.pick.s1=e.target.value; if(S.pick.s2===S.pick.s1) S.pick.s2=''; persist(); renderSchemes();};
  $('#pk2').onchange=e=>{S.pick.s2=e.target.value; if(!S.pick.s1) S.pick.s1=a; persist(); renderSchemes();};
  $('#pkAuto').onclick=()=>{S.pick={s1:'',s2:''}; persist(); renderSchemes();};
  $('#sv').onchange=e=>{schemeView=+e.target.value;renderSchemes();};
  $('#selK2').onchange=e=>{viewK2=+e.target.value;renderSchemes();};
  bindCopy(h);
  $('#bCsv').onclick=()=>{
    const rows=[['Level','Direction','Grid line','From','To','Span (m)','Available depth (m)','Carries above','Secondary','Scheme 1 system','Scheme 1 depth (m)','Scheme 2 system','Scheme 2 depth (m)']];
    const d=c=>c?(['STRUSS','RCWALL','HANG'].includes(c.sys)?f(c.H,2):['COVERED','NOTREQ'].includes(c.sys)?'':f(c.req,2)):'';
    M.members.forEach(m=>{ const c1=e1.ch[m.id],c2=e2.ch[m.id];
      rows.push([m.special?m.name:m.level,m.dir,m.lineLabel,m.ends[0]||'',m.ends[1]||'',f(m.span,2),f(m.avail,2),m.carries?'Y':'',m.secondary?'Y':'',c1?SYS_EN[c1.sys]:'NOT FEASIBLE',d(c1),c2?SYS_EN[c2.sys]:'NOT FEASIBLE',d(c2)]); });
    rows.push([]); rows.push(['Omitted columns']); M.omit.forEach(o=>rows.push([o.node,`${M.L[o.s1].name} to ${M.L[o.s2+1].name}`,[...o.why].join('/')]));
    rows.push([]); rows.push(['Transfer points','Level','Kind','Carries','Incline d/h']); M.tpoints.forEach(t=>rows.push([t.label,M.L[t.k].name,[...t.kinds].join('/'),t.carries?'Y':'',t.incl?f(t.incl.ratio,2):'']));
    download('members.csv','﻿'+rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n'),'text/csv');
  };
  $('#bTxt').onclick=()=>download('schemes.txt',`${S.title}\n\n${t1}\n\n${t2}\n\n${recTxt}\n`,'text/plain');
}

/* ---------- Span questions ---------- */
function runSVG(run,picks){
  const Lr=num(run.L)||1; const W=820,pad=30; const s=(W-2*pad)/Lr;
  const zs=(run.zones||[]).map(z=>({from:num(z.from),to:num(z.to),name:z.name,noSupport:!!z.noSupport,noTemp:!!z.noTemp,depth:num(z.depth)})).filter(z=>z.from!==null&&z.to!==null);
  const rowH=60, H=60+picks.length*rowH+10; const X=x=>pad+x*s;
  let g='';
  zs.forEach((z,i)=>{ const a=Math.min(z.from,z.to),b=Math.max(z.from,z.to);
    g+=`<rect x="${X(a)}" y="18" width="${(b-a)*s}" height="${H-30}" fill="${z.noSupport?'var(--colfree)':'var(--void)'}" fill-opacity=".45" stroke="var(--mute)" stroke-dasharray="4 3"/>`;
    g+=`<text x="${X(a)+3}" y="${30+(i%2)*12}">${esc(z.name)}${z.depth!==null?' (depth ≤ '+z.depth+' m)':''}${z.noTemp?' no temp. works':''}</text>`; });
  g+=`<text x="${X(0)}" y="12">0</text><text x="${X(Lr)}" y="12" text-anchor="end">${f(Lr,1)} m</text>`;
  picks.forEach((r,pi)=>{ const y=60+pi*rowH+20; const c=pi?'var(--m2)':'var(--m1)';
    g+=`<text x="${pad}" y="${y-16}" style="font-weight:600;fill:${c}">Scheme ${pi+1}: ${esc(r.sys.name)}</text>`;
    g+=`<line x1="${X(0)}" y1="${y}" x2="${X(Lr)}" y2="${y}" stroke="${c}" stroke-width="5"/>`;
    r.sup.forEach(x=>{ g+=`<path d="M${X(x)} ${y+3}l-7 12h14z" fill="${c}"/><text x="${X(x)}" y="${y+27}" text-anchor="middle" style="font-size:10px">${f(x,1)}</text>`; });
    r.spans.forEach(sp=>{ g+=`<text x="${X((sp.a+sp.b)/2)}" y="${y-5}" text-anchor="middle" style="font-size:10px">${f(sp.s,1)} m</text>`; });
    r.cants.forEach(cn=>{ g+=`<text x="${X((cn.a+cn.b)/2)}" y="${y-5}" text-anchor="middle" style="font-size:10px">cantilever ${f(cn.s,1)} m</text>`; });
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px">${g}</svg>`;
}
function renderSpans(){
  const h=$('#tab-spans'); h.innerHTML='';
  const intro=card(h,'Span questions (bridges, footbridges, stand roofs, glasshouses, etc.)','Along one line (e.g. along a bridge, or across / along a roof) enter the total length, zones where supports are not allowed, and depth limits. The tool chooses support positions and structural types and gives two schemes. If both directions are constrained, add two lines (e.g. roof transverse and longitudinal). Distances are measured from the start in m; include any required clearance in the zones.');
  const rb=document.createElement('div'); rb.className='row';
  const addBtn=(t,fn)=>{const b=document.createElement('button');b.textContent=t;b.onclick=fn;rb.appendChild(b);};
  addBtn('+ Add a line',()=>{S.runs.push({name:'New span',kind:'bridge',L:30,startSup:true,endSup:true,minSpacing:'',maxSupports:'',defaultDepth:'',possession:false,light:false,rockDepth:'',soft:false,zones:[]});persist();renderSpans();});
  addBtn('Add example: Q6 road bridge',()=>{S.runs.push(clone(RUN_Q6));persist();renderSpans();});
  addBtn('Add example: Q4 footbridge',()=>{S.runs.push(clone(RUN_Q4));persist();renderSpans();});
  addBtn('Add example: Q3 stand roof (two directions)',()=>{S.runs.push(clone(RUN_Q3X),clone(RUN_Q3L));persist();renderSpans();});
  intro.appendChild(rb);
  const lib=document.createElement('details'); lib.style.marginTop='8px';
  lib.innerHTML='<summary>Show the structural system library (span/depth ratios, max. spans)</summary>'+Object.entries(SPAN_LIB).map(([k,arr])=>`<h3>${KIND_NAME[k]}</h3><table><thead><tr><th>System</th><th>Span/depth or fixed depth</th><th>Max. span</th><th>Cantilever</th><th>Needs falsework</th></tr></thead><tbody>${arr.map(s=>`<tr><td>${esc(s.name)}</td><td>${s.fixedDepth?'fixed '+s.fixedDepth+' m':'L/'+s.ratio}</td><td>${s.maxSpan} m</td><td>${s.noCant?'no':s.cantMax?'≤ '+s.cantMax+' m':s.cantRatio?'L/'+s.cantRatio:'no'}</td><td>${s.falsework?'yes':'no'}</td></tr>`).join('')}</tbody></table>`).join('');
  intro.appendChild(lib);
  S.runs.forEach((run,ri)=>{
    const c=card(h,`${ri+1}. ${run.name||'Span'}`);
    const r1=document.createElement('div'); r1.className='row';
    const redraw=()=>renderSpans();
    r1.append(field('Name',run,'name',{w:'220px'}),field('Type',run,'kind',{type:'select',options:Object.entries(KIND_NAME),after:redraw}),field('Total length (m)',run,'L',{w:'70px'}),
      field('Support allowed at start',run,'startSup',{type:'check',after:redraw}),field('Support allowed at end',run,'endSup',{type:'check',after:redraw}),field('Min. support spacing (m)',run,'minSpacing',{w:'70px'}),field('Max. number of supports',run,'maxSupports',{w:'70px'}),
      field('General depth limit (m)',run,'defaultDepth',{w:'70px'}),field('Construction only during possessions',run,'possession',{type:'check',after:redraw}),field('Light structure required',run,'light',{type:'check',after:redraw}),
      field('Rockhead depth below ground (m)',run,'rockDepth',{w:'70px'}),field('Soft ground / fill',run,'soft',{type:'check',after:redraw}));
    c.appendChild(r1);
    const zt=document.createElement('div'); zt.style.marginTop='8px'; zt.innerHTML='<div class="hint">Restricted zones (measured from the start)</div>'; c.appendChild(zt);
    tableEditor(zt,run.zones,[{key:'name',label:'Name'},{key:'from',label:'From (m)',type:'num'},{key:'to',label:'To (m)',type:'num'},{key:'noSupport',label:'No supports',type:'check',def:true},{key:'noTemp',label:'No temporary works',type:'check'},{key:'depth',label:'Max. depth (m)',type:'num'}],redraw);
    const out=document.createElement('div'); out.className='runout'; out.dataset.ri=ri; c.appendChild(out);
    const del=document.createElement('button'); del.textContent='Delete this line'; del.style.marginTop='8px'; del.onclick=()=>{ if(confirm('Delete?')){S.runs.splice(ri,1);persist();renderSpans();} }; c.appendChild(del);
  });
  updateSpanOutputs();
}
function updateSpanOutputs(){
  document.querySelectorAll('#tab-spans .runout').forEach(out=>{
    const run=S.runs[+out.dataset.ri]; if(!run) return;
    const E=evalRun(run);
    let html=`<h3>Results by structural system</h3><div class="tblwrap"><table><thead><tr><th>System</th><th>Result</th><th>Support positions (m)</th><th>Max. span / cantilever</th><th>Depth required</th><th>Score (lower = better)</th></tr></thead><tbody>`;
    E.res.forEach(r=>{ html+=`<tr><td>${esc(r.sys.name)}</td><td class="${r.ok?'ok':'bad'}">${r.ok?'feasible':'not feasible'}</td><td>${r.ok?r.sup.map(x=>f(x,1)).join(', '):esc(r.why||'')}</td><td>${r.ok?f(Math.max(0,...r.spans.map(s=>s.s)),1)+(r.cants.length?' / cantilever '+r.cants.map(c=>f(c.s,1)).join(', '):''):''}</td><td>${r.ok?f(r.maxReq):''}</td><td>${r.ok?f(r.score,1):''}</td></tr>`; });
    html+='</tbody></table></div>';
    if (E.pick.length){
      html+=runSVG(run,E.pick);
      E.pick.forEach((r,i)=>{ const id=`rt${out.dataset.ri}_${i}`; html+=`<div class="card" style="margin-top:8px"><h2>Scheme ${i+1} (draft text)<button data-copy="${id}" style="float:right">Copy</button></h2><pre class="txt" id="${id}">${esc(runText(run,r,'Scheme '+(i+1)))}</pre></div>`; });
      if (E.pick.length===2){ const [p,q]=E.pick; const why=[]; if(p.score<q.score) why.push('lower overall cost (balance of member size and number of supports)'); if(p.sup.length<q.sup.length) why.push('fewer supports within the constrained site'); if(run.possession&&p.sys.lift) why.push('can be erected within the possession periods without falsework'); if(run.light&&p.sys.mat==='st') why.push("meets the client's requirement for a light structure");
        const id=`rr${out.dataset.ri}`; html+=`<div class="card"><h2>Reasons for recommendation (draft text)<button data-copy="${id}" style="float:right">Copy</button></h2><pre class="txt" id="${id}">${esc(`Recommendation: Scheme 1 (${p.sys.en}) is recommended because:\n`+(why.length?why:['better overall balance of cost, buildability and risk']).map(w=>'- '+w).join('\n'))}</pre></div>`; }
      if (E.pick.length<2) html+='<div class="err">Only one feasible system: consider relaxing the constraints (support positions, depth) or choose the second scheme by judgement.</div>';
    } else html+='<div class="err">No feasible system: check the restricted zones, depth limits and support count, or this question needs a special system (e.g. arch bridge, cable-stayed) [MANUAL JUDGEMENT].</div>';
    out.innerHTML=html; bindCopy(out);
  });
}

/* ---------- Misc ---------- */
function bindCopy(root){ root.querySelectorAll('[data-copy]').forEach(btn=>btn.onclick=()=>{ const t=document.getElementById(btn.dataset.copy).textContent; (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>flash('Copied'),()=>flash('Copy failed; please select the text manually')); }); }
function download(name,text,type){ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([text],{type:type+';charset=utf-8'})); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500); }
let flashT; function flash(t){ $('#status').textContent=t; clearTimeout(flashT); flashT=setTimeout(()=>$('#status').textContent='',2500); }
let tabNow='input', timer=null;
function changed(){ persist(); clearTimeout(timer); timer=setTimeout(recompute,250); }
function recompute(){
  try { M=buildModel(S); } catch(e){ M={err:['Calculation error: '+e.message]}; console.error(e); }
  if (tabNow==='input') renderDraw(); if (tabNow==='analysis') renderAnalysis(); if (tabNow==='schemes') renderSchemes(); if (tabNow==='spans') updateSpanOutputs();
  const n=M.err?.length; $('#status').textContent=n?`${n} input problem(s) (see analysis tab)`:`Updated: ${M.members?.length||0} long-span / transfer members, ${M.tpoints?.length||0} transfer points`;
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  tabNow=b.dataset.tab; document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));
  ['input','analysis','schemes','spans'].forEach(t=>$('#tab-'+t).hidden=t!==tabNow);
  if (tabNow==='spans') renderSpans();
  recompute();
});
$('#selPreset').onchange=e=>{
  const v=e.target.value; e.target.value=''; if(!v) return;
  if (v==='spans'){ S.runs.push(clone(RUN_Q6),clone(RUN_Q4),clone(RUN_Q3X),clone(RUN_Q3L)); persist(); document.querySelector('nav button[data-tab=spans]').click(); return; }
  if (!confirm('Loading will replace the current building input (span questions are kept). Continue?')) return;
  const runs=S.runs; S=normalize(v==='q2'?PRESET_Q2:v==='q1'?presetQ1():BLANK); S.runs=runs; viewK=viewK2=null; DRAW.s=null; renderInput(); changed();
};
$('#bSave').onclick=()=>download((S.title||'project').replace(/[\\/:*?"<>|]/g,'_')+'.json',JSON.stringify(S,null,1),'application/json');
$('#bOpen').onclick=()=>$('#fOpen').click();
$('#fOpen').onchange=e=>{ const file=e.target.files[0]; if(!file)return; const r=new FileReader(); r.onload=()=>{ try{ const d=JSON.parse(r.result); if(!(d.grids||d.grid)||!d.levels) throw new Error('unrecognised format'); S=normalize(d); viewK=viewK2=null; DRAW.s=null; renderInput(); if(tabNow==='spans') renderSpans(); changed(); flash('Opened '+file.name);}catch(err){alert('Could not open: '+err.message);} }; r.readAsText(file); e.target.value=''; };

renderInput(); recompute();
</script>
